<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff9b4a">
  <title>อัลกอรึทึมแสนสนุก</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#51342b;--orange:#f57a35;--orange-dark:#b94d25;--mint:#64cdb0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Mali",cursive;color:var(--ink);background:linear-gradient(145deg,#fff1ad,#ffbd7c);-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit}button:focus-visible{outline:5px solid #3aa6ff;outline-offset:3px}
    .screen{min-height:100vh;display:none;place-items:center;padding:22px}.screen.on{display:grid}.box{width:min(920px,96vw);text-align:center;background:#fffffff2;border:5px solid #fff;border-radius:38px;padding:32px;box-shadow:0 15px 0 #d86e38,0 25px 55px #9b552733}h1{font-size:clamp(38px,6vw,68px);line-height:1.15;margin:12px 0;color:#6a321f}.subtitle{font-size:clamp(18px,3vw,25px);margin:7px 0 22px}
    .hero-flow{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}.hero-flow span{font-size:clamp(46px,8vw,76px);background:#fff4cc;padding:10px 16px;border-radius:26px;box-shadow:0 7px 0 #e8ca82}.hero-flow i{font-size:32px;color:#e27031;font-style:normal}.primary,.secondary,.icon-btn{border:0;cursor:pointer;font-weight:700}.primary{border-radius:20px;padding:14px 30px;background:linear-gradient(#ff9b4d,#ed6c2c);color:#fff;font-size:22px;box-shadow:0 7px 0 var(--orange-dark)}.primary:active{transform:translateY(5px);box-shadow:0 2px 0 var(--orange-dark)}.secondary{border-radius:17px;padding:11px 20px;background:#fff1bd;color:#7b4a28;box-shadow:0 5px 0 #dbb366}
    .level-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:24px auto 8px}.level-card{position:relative;border:4px solid #fff;border-radius:27px;padding:16px 13px 19px;background:var(--bg);box-shadow:0 8px 0 var(--shadow);cursor:pointer;transition:.18s transform;text-align:center;min-height:190px}.level-card:hover{transform:translateY(-4px)}.level-card .scene{font-size:66px;line-height:1.1;display:block;filter:drop-shadow(0 4px 0 #ffffff80)}.level-card b{display:block;font-size:22px;margin-top:10px}.badge{position:absolute;top:10px;left:10px;background:#fff;color:#795033;border-radius:18px;padding:5px 11px;font-weight:700}.level-stars{min-height:25px;color:#db7c00;font-size:19px}
    .game{display:none;min-height:100vh;padding:14px;background:linear-gradient(#fff0bb 0 23%,#fffaf0 23%)}.game.on{display:block}.top{max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.top-title{font-size:clamp(18px,3vw,27px);font-weight:700;text-align:center}.icon-btn{width:48px;height:44px;border-radius:15px;background:#fff;box-shadow:0 5px 0 #e3bd82;font-size:24px}.score{font-size:21px;background:#fff;padding:9px 14px;border-radius:16px;box-shadow:0 5px 0 #e3bd82;font-weight:700;white-space:nowrap}.bar{max-width:1280px;height:16px;background:#fff;border-radius:20px;margin:16px auto;overflow:hidden;border:2px solid #f2d496}.bar i{display:block;height:100%;background:linear-gradient(90deg,#54c49f,#6fd8c1);width:0;transition:.35s}
    .area{max-width:1280px;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.tray,.target{background:#fff;border-radius:28px;padding:17px;min-height:565px;box-shadow:0 10px 28px #9a63252b}.tray h2{font-size:20px;text-align:center;margin:3px 0 14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{min-height:220px;border:3px solid color-mix(in srgb,var(--c),#92582f 18%);border-radius:22px;background:color-mix(in srgb,var(--c),white 50%);box-shadow:0 7px 0 color-mix(in srgb,var(--c),#8b5434 27%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;padding:10px;touch-action:manipulation}.card:hover{filter:brightness(1.03);transform:translateY(-2px)}.card .pic{width:112px;height:112px;border-radius:28px;background:#fff;box-shadow:0 5px 0 #ffffff80,0 8px 18px #6543211c;display:grid;place-items:center;font-size:76px;line-height:1;overflow:hidden}.card b{font-size:20px;margin-top:13px}.card small{font-size:14px;margin-top:3px;color:#765d53}
    .target{border:4px dashed #68c8ae;background:#f6fffb;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.target.ready{background:#eafff7;transform:scale(1.01)}.target.bad{animation:shake .35s;background:#fff0ed;border-color:#f39a89}.target.good{animation:pop .35s;background:#edfff1}.target-scene{font-size:clamp(92px,12vw,145px);line-height:1.05;filter:drop-shadow(0 6px 0 #cdeee0)}.num{background:#d9f4e9;color:#17876e;padding:6px 14px;border-radius:20px;font-weight:700}.msg{font-size:19px;min-height:30px;margin:13px 0}.steps{display:flex;gap:7px;margin-top:18px;flex-wrap:wrap;justify-content:center}.dot{width:47px;height:47px;border-radius:50%;background:#ede2d4;display:grid;place-items:center;font-weight:700}.dot.ok{background:#dff4ba;font-size:25px}.finish-scene{font-size:clamp(92px,16vw,150px);line-height:1.05}.stars{font-size:52px;letter-spacing:5px}.score-line{font-size:23px}.done-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:15px}.safe{background:#fff0db;border-radius:14px;padding:9px;color:#98592f;font-weight:700;margin:18px 0 0}
    @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes pop{50%{transform:scale(1.025)}}
    @media(max-width:800px){.area{grid-template-columns:1fr}.target{grid-row:1;min-height:305px}.tray{min-height:0}.cards{grid-template-columns:repeat(3,1fr)}.card{min-height:175px}.card .pic{width:88px;height:88px;border-radius:23px;font-size:62px}.game{background:linear-gradient(#fff0bb 0 14%,#fffaf0 14%)}}
    @media(max-width:560px){.box{padding:25px 13px;border-radius:29px}.level-grid{grid-template-columns:1fr 1fr;gap:11px}.level-card{min-height:155px;padding:15px 7px}.level-card .scene{font-size:48px}.level-card b{font-size:16px}.badge{font-size:12px;padding:4px 8px}.hero-flow span{padding:7px 10px}.hero-flow i{font-size:21px}.game{padding:8px}.top-title{font-size:16px}.icon-btn{width:42px}.score{font-size:17px;padding:9px}.cards{grid-template-columns:repeat(2,1fr);gap:11px}.card{min-height:165px}.card .pic{width:82px;height:82px;border-radius:21px;font-size:58px}.card b{font-size:16px}.card small{display:none}.target{min-height:275px}.target-scene{font-size:88px}.steps{gap:4px}.dot{width:38px;height:38px}.tray h2{font-size:17px}}
  </style>
</head>
<body>
  <main id="start" class="screen on"><section class="box"><div class="hero-flow" aria-hidden="true"><span>🍳</span><i>➜</i><span>🧺</span><i>➜</i><span>🌱</span><i>➜</i><span>🏫</span></div><h1>อัลกอรึทึมแสนสนุก</h1><p class="subtitle">เรียงภาพให้ถูกลำดับ</p><button class="primary" onclick="showLevels()">เลือกด่าน ▶</button></section></main>
  <main id="levels" class="screen"><section class="box"><h1 style="font-size:clamp(35px,5vw,55px)">เลือกด่าน</h1><div id="levelGrid" class="level-grid"></div><button class="secondary" onclick="show('start')">⌂ หน้าหลัก</button></section></main>
  <main id="game" class="game"><header class="top"><button class="icon-btn" onclick="showLevels()" aria-label="เลือกด่าน">⌂</button><div id="topTitle" class="top-title"></div><div class="score">⭐ <span id="score">60</span></div></header><div class="bar"><i id="bar"></i></div><section class="area"><div class="tray"><h2>🖼️ เลือกภาพ</h2><div id="cards" class="cards"></div></div><div id="target" class="target" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" ondragover="event.preventDefault()" ondrop="dropCard(event)"><div id="targetScene" class="target-scene"></div><div id="num" class="num">1 / 6</div><p id="msg" class="msg">ลากหรือแตะภาพแรก</p><button class="secondary" onclick="showHint()">💡 คำใบ้</button><div id="steps" class="steps"></div></div></section></main>
  <main id="done" class="screen"><section class="box"><div id="finishScene" class="finish-scene"></div><h1 id="doneTitle" style="font-size:clamp(36px,6vw,62px)">สำเร็จ!</h1><div id="stars" class="stars">⭐⭐⭐</div><p class="score-line">⭐ <b id="finalScore">60</b> / 60</p><div class="done-actions"><button id="nextButton" class="primary" onclick="nextLevel()">ด่านต่อไป ▶</button><button class="secondary" onclick="startLevel(currentLevel)">เล่นอีกครั้ง ↻</button><button class="secondary" onclick="showLevels()">เลือกด่าน</button></div><p id="safe" class="safe"></p></section></main>
  <script>
    const levels=[
      {title:'ขั้นตอนการทำไข่เจียว',menu:'ทำไข่เจียว',scene:'🥚🍳',finish:'🍳✨',done:'พร้อมเสิร์ฟ!',safe:'🔥 ใช้เตากับผู้ใหญ่',colors:['#ffd86b','#ffb57a','#9de3d1','#ff9e91','#b6d8ff','#d7b8ff'],steps:[['🥚','ตอกไข่','ใส่ชาม'],['🧂','ปรุงรส','เล็กน้อย'],['🥣','ตีไข่','ให้เข้ากัน'],['🔥','ตั้งกระทะ','ผู้ใหญ่ช่วย'],['🫗','เทไข่','ลงกระทะ'],['🍳','ทอดให้สุก','พร้อมเสิร์ฟ']]},
      {title:'การซักผ้าและตาก',menu:'ซักผ้าและตาก',scene:'👕🧺',finish:'👕☀️',done:'ผ้าสะอาด!',safe:'☀️ ตากผ้าให้แห้ง',colors:['#ffcb77','#a9def9','#b8e0d2','#cdb4db','#ffc8dd','#fde2a7'],steps:[['👕','แยกผ้า','ก่อนซัก'],['🧺','ใส่เครื่อง','ซักผ้า'],['🧴','ใส่น้ำยา','พอดี'],['🫧','ซักผ้า','ให้สะอาด'],['👚','นำไปตาก','บนราว'],['☀️','รอให้แห้ง','เก็บผ้า']]},
      {title:'การปลูกต้นไม้',menu:'ปลูกต้นไม้',scene:'🌱🌳',finish:'🌳🌼',done:'ต้นไม้โตแล้ว!',safe:'💧 รดน้ำพอดี',colors:['#d9b38c','#b7e4c7','#ffe08a','#c8b6ff','#95d5b2','#ffd6a5'],steps:[['🪴','เตรียมดิน','ในกระถาง'],['🥄','ขุดหลุม','เล็ก ๆ'],['🌰','ใส่เมล็ด','ลงหลุม'],['🤲','กลบดิน','เบา ๆ'],['💧','รดน้ำ','พอดี'],['🌱','รับแสงแดด','ดูแลทุกวัน']]},
      {title:'การไปโรงเรียน',menu:'ไปโรงเรียน',scene:'🎒🏫',finish:'🏫📚',done:'ถึงโรงเรียน!',safe:'🚸 เดินทางอย่างปลอดภัย',colors:['#ffe08a','#a9def9','#cdb4db','#ffcad4','#b8e0d2','#ffc078'],steps:[['⏰','ตื่นนอน','ตอนเช้า'],['🚿','อาบน้ำ','แปรงฟัน'],['👕','แต่งตัว','ชุดนักเรียน'],['🍞','กินอาหาร','มื้อเช้า'],['🎒','จัดกระเป๋า','ให้พร้อม'],['🚌','ไปโรงเรียน','ปลอดภัย']]}
    ];
    const $=id=>document.getElementById(id);let currentLevel=0,nextStep=1,score=60,dragged=0;
    function savedScore(i){try{return Number(localStorage.getItem(`funAlgoScore${i}`)||0)}catch(e){return 0}}
    function saveScore(i,value){try{localStorage.setItem(`funAlgoScore${i}`,value)}catch(e){}}
    function show(id){['start','levels','game','done'].forEach(x=>$(x).classList.toggle('on',x===id))}
    function showLevels(){renderLevels();show('levels')}
    function renderLevels(){$('levelGrid').innerHTML=levels.map((level,i)=>{const saved=savedScore(i),stars=saved?(saved>=50?'⭐⭐⭐':saved>=35?'⭐⭐':'⭐'):'○ ○ ○';return `<button class="level-card" style="--bg:${level.colors[0]}99;--shadow:${level.colors[0]}" onclick="startLevel(${i})" aria-label="ด่านที่ ${i+1} ${level.menu}"><span class="badge">ด่าน ${i+1}</span><span class="scene">${level.scene}</span><b>${level.menu}</b><span class="level-stars">${stars}</span></button>`}).join('')}
    function startLevel(index){currentLevel=index;nextStep=1;score=60;const level=levels[index];$('topTitle').textContent=`ด่าน ${index+1} · ${level.title}`;$('targetScene').textContent=level.scene;$('score').textContent=score;$('bar').style.width='0';$('msg').textContent='ลากหรือแตะภาพแรก';renderCards();show('game')}
    function shuffledRemaining(){return levels[currentLevel].steps.map((_,i)=>i+1).filter(i=>i>=nextStep).sort(()=>Math.random()-.5)}
    function renderCards(){const level=levels[currentLevel];$('cards').innerHTML=shuffledRemaining().map(i=>{const d=level.steps[i-1],c=level.colors[i-1];return `<button class="card" style="--c:${c}" draggable="true" ondragstart="dragged=${i}" ondragend="dragEnd()" onclick="choose(${i})" aria-label="${d[1]} ${d[2]}"><span class="pic">${d[0]}</span><b>${d[1]}</b><small>${d[2]}</small></button>`}).join('');$('steps').innerHTML=level.steps.map((d,i)=>`<span class="dot ${i<nextStep-1?'ok':''}">${i<nextStep-1?d[0].split(/[➡️]/)[0]:i+1}</span>`).join('');$('num').textContent=`${Math.min(nextStep,6)} / 6`}
    function dragEnter(e){e.preventDefault();$('target').classList.add('ready')}function dragLeave(e){if(!$('target').contains(e.relatedTarget))$('target').classList.remove('ready')}function dragEnd(){dragged=0;$('target').classList.remove('ready')}function dropCard(e){e.preventDefault();$('target').classList.remove('ready');if(dragged)choose(dragged);dragged=0}
    function choose(i){if(i===nextStep){nextStep++;$('bar').style.width=`${(nextStep-1)/6*100}%`;$('msg').textContent=nextStep>6?'สำเร็จ!':'✓ ถูกต้อง';$('target').classList.add('good');setTimeout(()=>$('target').classList.remove('good'),350);renderCards();if(nextStep>6)setTimeout(finish,500)}else{score=Math.max(0,score-5);$('score').textContent=score;$('msg').textContent='ลองใหม่ ↻';$('target').classList.add('bad');setTimeout(()=>$('target').classList.remove('bad'),400)}}
    function showHint(){score=Math.max(0,score-2);$('score').textContent=score;const d=levels[currentLevel].steps[nextStep-1];if(d)$('msg').textContent=`${d[0]} ${d[1]}`}
    function finish(){const level=levels[currentLevel],old=savedScore(currentLevel);if(score>old)saveScore(currentLevel,score);$('finishScene').textContent=level.finish;$('doneTitle').textContent=level.done;$('finalScore').textContent=score;$('stars').textContent=score>=50?'⭐⭐⭐':score>=35?'⭐⭐':'⭐';$('safe').textContent=level.safe;$('nextButton').style.display=currentLevel<levels.length-1?'inline-block':'none';show('done')}
    function nextLevel(){if(currentLevel<levels.length-1)startLevel(currentLevel+1)}
  </script>
</body>
</html>
